[build-system]
requires = ["setuptools==78.1.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ralf-bootstrap"
dynamic = ["version"]
description = "Read-only local status service for the RALF bootstrap"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "Gunicorn==26.0.0",
]

[project.optional-dependencies]
test = ["build==1.5.0", "pytest==9.1.1"]

[tool.setuptools.dynamic]
version = { attr = "ralf_bootstrap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ralf_bootstrap = ["templates/*.html", "static/*.css"]
