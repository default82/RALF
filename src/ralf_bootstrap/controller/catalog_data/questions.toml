schema_version = 1
catalog_version = 1

[[questions]]
id = "environment.platform"
section = "environment"
prompt = "Auf welcher Plattform läuft RALF?"
answer_type = "choice"
choices = ["Proxmox", "TrueNAS", "Docker", "Podman", "Bare Metal", "virtuelle Maschine", "anderes", "unbekannt"]

[[questions]]
id = "environment.virtualization"
section = "environment"
prompt = "Gibt es bereits eine Virtualisierungsplattform?"
answer_type = "choice"
choices = ["ja", "nein", "unbekannt", "nicht verwenden"]

[[questions]]
id = "environment.container"
section = "environment"
prompt = "Gibt es eine Containerplattform?"
answer_type = "choice"
choices = ["ja", "nein", "unbekannt", "nicht verwenden"]

[[questions]]
id = "environment.firewall"
section = "environment"
prompt = "Gibt es einen Router oder eine Firewall?"
answer_type = "choice"
choices = ["ja", "nein", "unbekannt", "nicht verwenden"]

[[questions]]
id = "environment.systems"
section = "environment"
prompt = "Welche Systeme sollen als vorhandene Infrastruktur erfasst werden?"
answer_type = "text"

[[questions]]
id = "existing.secure-ingress"
section = "existing"
prompt = "Ist sicherer Ingress bereits vorhanden?"
answer_type = "choice"
choices = ["ja", "nein", "unbekannt", "nicht verwenden"]

[[questions]]
id = "existing.secure-ingress.product"
section = "existing"
prompt = "Welches Produkt oder welcher Provider stellt sicheren Ingress bereit?"
answer_type = "text"
follows = "existing.secure-ingress"
follows_value = "ja"

[[questions]]
id = "verification.secure-ingress"
section = "verification"
prompt = "Soll eine spätere read-only Prüfung des Ingress-Providers vorbereitet werden?"
answer_type = "boolean"
