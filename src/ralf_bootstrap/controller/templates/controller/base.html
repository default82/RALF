<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RALF Controller{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('controller.static', filename='controller.css') }}">
</head>
<body>
  <header class="topbar">
    <p class="eyebrow">RALF Bootstrap 0.2</p>
    <h1>Inventory-first Controller</h1>
    <p class="notice">Dieser Controller führt derzeit keine Infrastrukturänderungen aus.</p>
    <nav aria-label="Controller">
      <a href="{{ url_for('controller.dashboard') }}">Übersicht</a>
      <a href="{{ url_for('controller.inventory') }}">Inventar</a>
      <a href="{{ url_for('controller.questions') }}">Fragen</a>
      <a href="{{ url_for('controller.requirements') }}">Fähigkeiten</a>
      <a href="{{ url_for('controller.preferences') }}">Präferenzen</a>
      <a href="{{ url_for('controller.verification') }}">Prüfungen</a>
      <a href="{{ url_for('controller.review') }}">Bestätigen</a>
      <a href="{{ url_for('controller.plan') }}">Zielplan</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
