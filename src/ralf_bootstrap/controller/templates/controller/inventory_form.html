{% extends "controller/base.html" %}
{% block content %}
<section>
  <h2>{{ 'Inventareintrag bearbeiten' if item else 'Inventareintrag erfassen' }}</h2>
  <p class="warning">Keine Zugangsdaten oder Geheimnisse eingeben.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Fähigkeit
      <select name="capability_id" required>
      {% for capability in catalog.capabilities %}<option value="{{ capability.capability_id }}" {% if item and item.capability_id == capability.capability_id %}selected{% endif %}>{{ capability.display_name }}</option>{% endfor %}
      </select>
    </label>
    <label>Provider-ID <input name="provider_id" maxlength="128" required value="{{ item.provider_id if item else '' }}"></label>
    <label>Anzeigename <input name="display_name" maxlength="160" required value="{{ item.display_name if item else '' }}"></label>
    <label>Produkt <input name="product_name" maxlength="160" value="{{ item.product_name if item else '' }}"></label>
    <label>Standort <input name="location" maxlength="160" value="{{ item.location if item else '' }}"></label>
    <label>Management-URL <input type="url" name="management_url" maxlength="2048" value="{{ item.management_url if item and item.management_url else '' }}"></label>
    <label>Zustand
      <select name="state">{% for state in states %}<option value="{{ state }}" {% if (item and item.state == state) or (not item and state == 'reported') %}selected{% endif %}>{{ state }}</option>{% endfor %}</select>
    </label>
    <label>Verifikationsart
      <select name="verification_method"><option value="">nicht verifiziert</option>{% for method in ['manual','connector','local_probe','imported_evidence'] %}<option value="{{ method }}" {% if item and item.verification_method == method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select>
    </label>
    <label>Verifikationszeitpunkt <input name="last_verified_at" maxlength="64" value="{{ item.last_verified_at if item and item.last_verified_at else '' }}"></label>
    <label>Prüfumfang <textarea name="verification_scope" maxlength="500">{{ item.verification_scope if item else '' }}</textarea></label>
    <label>Evidenz <textarea name="verification_evidence" maxlength="500">{{ item.verification_evidence if item else '' }}</textarea></label>
    <label><input type="checkbox" name="verification_consent" value="yes" {% if item and item.verification_consent %}checked{% endif %}> Spätere read-only Prüfung vorbereiten</label>
    <button type="submit">Speichern</button>
  </form>
  {% if item %}
  <form method="post" action="{{ url_for('controller.inventory_delete', item_id=item.id) }}">
    <input type="hidden" name="csrf_token" value="{{ delete_csrf_token }}">
    <button type="submit">Eintrag löschen</button>
  </form>
  {% endif %}
</section>
{% endblock %}
