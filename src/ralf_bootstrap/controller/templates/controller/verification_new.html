{% extends "controller/base.html" %}
{% block title %}Verifikationsauftrag vorbereiten{% endblock %}
{% block content %}
<section>
  <h2>Verifikationsauftrag vorbereiten</h2>
  <form method="post" action="{{ url_for('provider_verification.verification_new_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Inventareintrag
      <select name="inventory_item_id" required>
      {% for item in inventory %}<option value="{{ item.id }}">{{ item.display_name }} – {{ item.state }}</option>{% endfor %}
      </select>
    </label>
    <label>Providervertrag
      <select name="contract_id" required>
      {% for contract in contracts %}<option value="{{ contract.contract_id }}">{{ contract.display_name }} v{{ contract.contract_version }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Auftrag vorbereiten</button>
  </form>
</section>
{% endblock %}
